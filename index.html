<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BudgetWise - Smart Budget Tracker</title>
    <meta name="description" content="Track expenses, set savings goals, and get AI-powered financial advice. Free for everyone." />
    <meta name="theme-color" content="#10b981" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Inter font (matches vanilla app exactly) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- No-flash theme bootstrap: matches vanilla index.html behavior exactly -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('bw-theme') === 'light') {
            document.documentElement.classList.add('light-early');
            document.addEventListener('DOMContentLoaded', function () {
              document.body.classList.add('light');
            });
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
