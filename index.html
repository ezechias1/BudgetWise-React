<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BudgetWise - Smart Budget Tracker</title>
    <meta name="description" content="Track expenses, set savings goals, and get AI-powered financial advice. Free for everyone." />
    <meta name="theme-color" content="#10b981" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Inter font (matches vanilla app exactly) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- No-flash theme bootstrap: matches vanilla index.html behavior exactly -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('bw-theme') === 'light') {
            document.documentElement.classList.add('light-early');
            document.addEventListener('DOMContentLoaded', function () {
              document.body.classList.add('light');
            });
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <!--
      ONE-TIME migration from the vanilla site's service worker.
      Visitors who used the old budget-wise-ruby.vercel.app vanilla site
      have the old `budgetwise-v34` SW cached in their browser, which
      intercepts requests and serves the old HTML/JS shell even after
      the alias swap to the React port. This snippet runs exactly once
      per browser (gated by localStorage) to unregister ALL old service
      workers, clear ALL caches, then hard reload so the fresh React
      shell is fetched from the network.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('bw-react-sw-migrated') === '1') return;
          if (!('serviceWorker' in navigator)) {
            localStorage.setItem('bw-react-sw-migrated', '1');
            return;
          }
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var hadOld = regs.length > 0;
            Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              })
              .then(function () {
                localStorage.setItem('bw-react-sw-migrated', '1');
                if (hadOld) {
                  // Hard reload bypassing the intercepted cache.
                  location.reload();
                }
              });
          });
        } catch (_) {
          try { localStorage.setItem('bw-react-sw-migrated', '1'); } catch (_) {}
        }
      })();
    </script>

    <div id="root">
      <!-- Inline loader: visible while the React bundle downloads / boots.
           React replaces #root's children on mount so this vanishes. -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #06060a;
          color: rgba(255, 255, 255, 0.5);
          font-family: 'Inter', -apple-system, sans-serif;
          font-size: 0.85rem;
        "
      >
        <div
          style="
            width: 36px;
            height: 36px;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: bw-spin 0.8s linear infinite;
          "
        ></div>
        <div>Loading BudgetWise…</div>
      </div>
      <style>
        @keyframes bw-spin {
          to {
            transform: rotate(360deg);
          }
        }
        html.light-early #root > div {
          background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 30%, #f5f3ff 70%, #eff6ff 100%) !important;
          color: rgba(0, 0, 0, 0.45) !important;
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the React service worker for PWA installability.
      // Only in production — avoids stale-cache headaches during dev.
      // Also waits for the migration flag so we don't race with the
      // old-SW cleanup above.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', function () {
          if (localStorage.getItem('bw-react-sw-migrated') !== '1') return;
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('SW register failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
