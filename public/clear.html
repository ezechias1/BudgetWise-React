<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing BudgetWise cache…</title>
    <style>
        body {
            font-family: -apple-system, 'Inter', sans-serif;
            background: #06060a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
        }
        .box {
            max-width: 420px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }
        h1 { font-size: 1.3rem; margin: 0 0 12px; color: #10b981; }
        p { margin: 8px 0; color: rgba(255,255,255,0.7); font-size: 0.9rem; line-height: 1.6; }
        .status { margin-top: 20px; font-family: monospace; font-size: 0.75rem; color: rgba(255,255,255,0.4); }
        .spinner {
            width: 24px; height: 24px; margin: 20px auto 0;
            border: 3px solid rgba(16,185,129,0.2);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <h1>Clearing BudgetWise cache</h1>
        <p>Unregistering old service workers and wiping browser caches so you see the latest version.</p>
        <p><strong>Your account data is safe</strong> — it lives in the database, not your browser.</p>
        <div class="spinner"></div>
        <div class="status" id="status">Starting…</div>
    </div>
    <script>
        (async function () {
            var status = document.getElementById('status');
            var log = function (msg) { status.textContent = msg; };
            try {
                log('Checking service workers…');
                if ('serviceWorker' in navigator) {
                    var regs = await navigator.serviceWorker.getRegistrations();
                    log('Found ' + regs.length + ' worker(s), unregistering…');
                    for (var i = 0; i < regs.length; i++) {
                        await regs[i].unregister();
                    }
                }
                log('Clearing caches…');
                if ('caches' in window) {
                    var keys = await caches.keys();
                    for (var j = 0; j < keys.length; j++) {
                        await caches.delete(keys[j]);
                    }
                }
                log('Setting migration flag…');
                try { localStorage.setItem('bw-react-sw-migrated', '1'); } catch (_) {}
                log('Done. Redirecting…');
                setTimeout(function () {
                    // Cache-bust the redirect so the browser doesn't use any http cache
                    location.replace('/?_reset=' + Date.now());
                }, 600);
            } catch (e) {
                log('Error: ' + (e && e.message ? e.message : e));
            }
        })();
    </script>
</body>
</html>
